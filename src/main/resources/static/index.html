<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · AI 知识库助手</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/assets/login.css">
</head>
<body>

<!-- 图标:Lucide(ISC License),内联 sprite -->
<svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></symbol>
    <symbol id="i-circle-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
</svg>

<!-- 背景:蓝紫渐变 + 柔和光斑 -->
<div class="bg" aria-hidden="true">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
</div>

<main class="stage">
    <div class="card" id="card">

        <!-- 白色卡片里的波浪 -->
        <svg class="wave wave-top" viewBox="0 0 1000 160" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0,0 H1000 V38 C900,10 820,-6 700,26 C560,64 520,118 380,104 C250,92 190,40 90,48 C50,51 22,64 0,78 Z" fill="url(#waveTop)"/>
            <defs><linearGradient id="waveTop" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9f1ff"/><stop offset="1" stop-color="#e9f6fd"/></linearGradient></defs>
        </svg>
        <svg class="wave wave-bottom" viewBox="0 0 1000 180" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0,180 H1000 V70 C930,40 860,30 780,60 C680,98 620,150 470,126 C360,108 330,70 240,80 C150,90 110,140 0,120 Z" fill="url(#waveBottom)"/>
            <defs><linearGradient id="waveBottom" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eaf2ff"/><stop offset="1" stop-color="#dce8ff"/></linearGradient></defs>
        </svg>
        <span class="bubble-deco" aria-hidden="true"></span>

        <!-- 左:插画 -->
        <section class="art">
            <img src="/assets/login-illustration.svg" alt="" draggable="false">
        </section>

        <!-- 右:表单 -->
        <section class="panel">
            <div id="form-view">
                <div class="title-row">
                    <span class="brand-mark"><img class="brand-logo" src="/assets/logo.png" srcset="/assets/logo.png 1x, /assets/logo@2x.png 2x" alt="logo"></span>
                    <h1 class="title">欢迎登录 AI 知识库助手</h1>
                </div>
                <p class="subtitle">平台 FAQ 与售后问题，一个入口全部搞定</p>

                <form id="login-form" novalidate>
                    <div class="field" id="field-username">
                        <span class="field-icon"><svg class="icon"><use href="#i-user"></use></svg></span>
                        <input id="username" name="username" type="text" placeholder="账号"
                               autocomplete="username" spellcheck="false" maxlength="64" required>
                    </div>

                    <div class="field" id="field-password">
                        <span class="field-icon"><svg class="icon"><use href="#i-lock"></use></svg></span>
                        <input id="password" name="password" type="password" placeholder="密码"
                               autocomplete="current-password" maxlength="128" required>
                        <button id="toggle-password" class="field-action" type="button" aria-label="显示密码">
                            <svg class="icon icon-show"><use href="#i-eye"></use></svg>
                            <svg class="icon icon-hide"><use href="#i-eye-off"></use></svg>
                        </button>
                    </div>
                    <p class="caps-hint" id="caps-hint" hidden>
                        <svg class="icon"><use href="#i-circle-alert"></use></svg>大写锁定已开启
                    </p>

                    <div class="row">
                        <label class="checkbox">
                            <input id="remember" type="checkbox">
                            <span class="checkbox-box"><svg class="icon"><use href="#i-check"></use></svg></span>
                            记住账号
                        </label>
                        <button id="forgot-button" class="link" type="button">修改密码</button>
                    </div>

                    <div id="login-error" class="alert" role="alert" hidden>
                        <svg class="icon"><use href="#i-circle-alert"></use></svg>
                        <span id="login-error-text"></span>
                    </div>

                    <button id="login-button" class="submit" type="submit">
                        <span class="spinner" aria-hidden="true"></span>
                        <span class="submit-label">点击登录</span>
                    </button>
                </form>

                <p class="foot">没有账号？请联系管理员开通</p>
            </div>

            <!-- 修改密码:在登录之前用,靠"核对原密码"证明身份 -->
            <div id="pwd-view" hidden>
                <div class="title-row">
                    <span class="brand-mark"><img class="brand-logo" src="/assets/logo.png" srcset="/assets/logo.png 1x, /assets/logo@2x.png 2x" alt="logo"></span>
                    <h1 class="title">修改密码</h1>
                </div>
                <p class="subtitle">需要先核对原密码，再把新密码输入两次</p>

                <form id="pwd-form" novalidate>
                    <div class="field" id="field-pwd-username">
                        <span class="field-icon"><svg class="icon"><use href="#i-user"></use></svg></span>
                        <input id="pwd-username" type="text" placeholder="账号"
                               autocomplete="username" spellcheck="false" maxlength="64" required>
                    </div>

                    <div class="field" id="field-old-password">
                        <span class="field-icon"><svg class="icon"><use href="#i-lock"></use></svg></span>
                        <input id="old-password" type="password" placeholder="原密码"
                               autocomplete="current-password" maxlength="128" required>
                        <button class="field-action js-pwd-toggle" data-target="old-password"
                                type="button" aria-label="显示密码">
                            <svg class="icon icon-show"><use href="#i-eye"></use></svg>
                            <svg class="icon icon-hide"><use href="#i-eye-off"></use></svg>
                        </button>
                    </div>

                    <div class="field" id="field-new-password">
                        <span class="field-icon"><svg class="icon"><use href="#i-lock"></use></svg></span>
                        <input id="new-password" type="password" placeholder="新密码（至少 6 位）"
                               autocomplete="new-password" maxlength="128" required>
                        <button class="field-action js-pwd-toggle" data-target="new-password"
                                type="button" aria-label="显示密码">
                            <svg class="icon icon-show"><use href="#i-eye"></use></svg>
                            <svg class="icon icon-hide"><use href="#i-eye-off"></use></svg>
                        </button>
                    </div>

                    <div class="field" id="field-confirm-password">
                        <span class="field-icon"><svg class="icon"><use href="#i-lock"></use></svg></span>
                        <input id="confirm-password" type="password" placeholder="再输入一次新密码"
                               autocomplete="new-password" maxlength="128" required>
                        <button class="field-action js-pwd-toggle" data-target="confirm-password"
                                type="button" aria-label="显示密码">
                            <svg class="icon icon-show"><use href="#i-eye"></use></svg>
                            <svg class="icon icon-hide"><use href="#i-eye-off"></use></svg>
                        </button>
                    </div>

                    <div id="pwd-error" class="alert" role="alert" hidden>
                        <svg class="icon"><use href="#i-circle-alert"></use></svg>
                        <span id="pwd-error-text"></span>
                    </div>

                    <button id="pwd-button" class="submit" type="submit">
                        <span class="spinner" aria-hidden="true"></span>
                        <span class="submit-label">确认修改</span>
                    </button>
                </form>

                <p class="foot"><button id="pwd-back" class="link" type="button">返回登录</button></p>
            </div>

            <!-- 成功态 -->
            <div class="success-view" id="success-view" hidden>
                <div class="success-mark">
                    <svg viewBox="0 0 52 52" aria-hidden="true">
                        <circle class="success-ring" cx="26" cy="26" r="24"/>
                        <path class="success-tick" d="M15 27l7 7 15-16"/>
                    </svg>
                </div>
                <h2 id="success-title">登录成功</h2>
                <p id="success-desc">正在进入对话…</p>
                <div class="progress"><span></span></div>
            </div>
        </section>
    </div>
</main>

<footer class="page-foot">Made by Shenzhen R&amp;D Center</footer>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/assets/login.js"></script>
</body>
</html>
