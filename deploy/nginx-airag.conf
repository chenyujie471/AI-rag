# =============================================================================
#  AI-Rag-search 前置反向代理
# =============================================================================
#
#  作用:把整个 FastGPT 搬到"我们自己的地址"后面,同时把对话接口截下来交给
#        我们的网关做配额校验与记账。
#
#  拓扑:
#
#    浏览器 ──> Nginx (本文件, 对外 :8080)
#                 │
#                 ├─ /api/auth|quota|records|chat|health ─> 我们的 Spring Boot :8100
#                 ├─ /assets/ /vendor/ /chat.html / 登录页 ─> 我们的 Spring Boot :8100
#                 ├─ /api/v1/chat/completions            ─┐
#                 ├─ /api/core/chat/completions          ─┴> 我们的 Spring Boot :8100  ★ 拦截计费
#                 └─ 其余全部(分享页 SPA、/_next、FastGPT 自己的 API) ─> FastGPT :4000
#
#  为什么这样做能同时满足三个需求:
#    ① 地址栏只出现我们自己的域名端口 —— 分享页是从我们自己这个源加载的;
#    ② 分享页原本 X-Frame-Options: SAMEORIGIN 的限制自动失效 —— 因为它现在是
#       "我们自己的同源页面",同源策略满足;想用 iframe 包也不再被挡;
#    ③ 对话请求被路由到我们的网关 —— 配额、每日上限、记账全部生效。
#
#  前提:本机(Nginx 所在机器)必须能出站访问 FastGPT。
#        FastGPT 不需要能反向访问我们 —— 这正是本方案在"本机开发、
#        FastGPT 在公网"的场景下仍然可用的原因。
#
#  用法:
#    1. 改下面 3 个地址(网关端口 / FastGPT 地址 / 对外端口);
#    2. 放到 nginx 的 conf.d 下(该目录被 http{} 包含,所以本文件里的
#       map / upstream / server 都是合法的);
#    3. nginx -t && nginx -s reload
# =============================================================================

# WebSocket 升级用(分享页若走 Socket.IO 需要;普通请求为 close)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 我们的 Spring Boot(application.yaml 里的 server.port)
upstream airag_gateway {
    server 127.0.0.1:8100;
    keepalive 32;
}

# 真实的 FastGPT
upstream fastgpt_upstream {
    server 202.140.142.70:4000;
    keepalive 32;
}

server {
    listen      8080;          # ★ 对外端口:用户访问 http://<你的机器>:8080/
    server_name _;

    # 流式对话可能跑很久,别让 Nginx 提前掐断
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_http_version    1.1;

    # 不要把上游的技术栈信息透给浏览器
    proxy_hide_header X-Powered-By;

    # -------------------------------------------------------------------------
    #  默认透传头(server 级别,下面所有 location 都会继承)
    #
    #  ⚠️ Nginx 的 proxy_set_header 是"全有或全无"式继承:某个 location 只要
    #     写了一条自己的 proxy_set_header,就会把从 server 继承来的这一整套
    #     全部丢弃。所以下面那两个流式 location 里我把这些头又完整写了一遍。
    # -------------------------------------------------------------------------
    proxy_set_header Host              $proxy_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # -------------------------------------------------------------------------
    #  1. 我们自己的后端接口
    #     (正则 location 优先级低于精确匹配,所以 /api/v1/chat/completions
    #      不会被这里抢走)
    # -------------------------------------------------------------------------
    location ~ ^/api/(auth|quota|records|chat|health)(/|$) {
        proxy_pass http://airag_gateway;

        # Host 用网关自己的地址,别把对外的 host 传进去
        proxy_set_header Host $proxy_host;
    }

    # -------------------------------------------------------------------------
    #  2. ★ 关键:FastGPT 的对话接口 —— 截到我们网关,做配额 + 记账
    #
    #  这两个是 FastGPT 常见的对话端点。分享页前端到底打哪个,请用浏览器
    #  F12 -> Network 发一条消息确认(见 README「怎么确认拦截路径」)。
    #  若发现是别的路径,把那个路径照抄一份到下面,并同步加进
    #  ShareChatProxyController 的 @PostMapping 注解。
    #
    #  proxy_buffering off 是必需的:否则 SSE 会被 Nginx 攒着,
    #  用户要等全部生成完才看到字。
    #
    #  Connection "" 是为了配合 upstream 的 keepalive;注意它同时也要求
    #  把继承来的 proxy_set_header 整套重写一遍(见上面的警告)。
    # -------------------------------------------------------------------------
    location = /api/v1/chat/completions {
        proxy_pass http://airag_gateway;

        proxy_buffering  off;
        proxy_cache      off;
        chunked_transfer_encoding on;

        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    location = /api/core/chat/completions {
        proxy_pass http://airag_gateway;

        proxy_buffering  off;
        proxy_cache      off;
        chunked_transfer_encoding on;

        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # -------------------------------------------------------------------------
    #  3. 我们自己的静态页面
    # -------------------------------------------------------------------------
    location = /                { proxy_pass http://airag_gateway; }
    location = /index.html      { proxy_pass http://airag_gateway; }
    location = /chat.html       { proxy_pass http://airag_gateway; }
    # 两个问答页(主线入口)。漏掉这两行的话,反代模式下它们会被 "/" 兜底送给
    # FastGPT,结果就是 404 —— 而且不会报错,只是页面打不开。
    location = /faq.html        { proxy_pass http://airag_gateway; }
    location = /after-sale.html { proxy_pass http://airag_gateway; }

    location /assets/       { proxy_pass http://airag_gateway; }
    location /vendor/       { proxy_pass http://airag_gateway; }

    # 可选的 iframe 伪装页(仅当 app.share.enabled=true 时才存在)。
    # 默认登录落地页已经是我们自己的 /faq.html,这个页面只在"想直接给用户看
    # FastGPT 原版界面"时才用得上 —— 把 app.auth.redirect-url 指到
    # /chat/share 即可,配额由本反代拦截生效。
    location = /portal      { proxy_pass http://airag_gateway; }

    # -------------------------------------------------------------------------
    #  4. 其余全部原样透传给 FastGPT
    #     包含:分享页 SPA(/chat/share)、Next.js 静态资源(/_next/**)、
    #           FastGPT 自己的其它 API(/api/core/**, /api/proApi/** ...)
    #
    #  ⚠️ 必须放在最后:前缀 "/" 是所有 location 里最短的,前面更具体的
    #     前缀与精确匹配会优先命中。
    #
    #  ⚠️ 注意这里不加 X-Forwarded-For 之外的改写:FastGPT 的 SPA 用相对路径
    #     请求自己的 API,原样转发即可。
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://fastgpt_upstream;

        # FastGPT 若因 Host 校验报错,把下面这行换成它的真实域名,例如:
        #   proxy_set_header Host fastgpt.example.com;
        # 默认用上游地址作为 Host,对多数自建部署都安全。
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 分享页自己也有流式输出,一并关缓冲
        proxy_buffering off;
        proxy_cache     off;

        # WebSocket / Socket.IO(若用到)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
